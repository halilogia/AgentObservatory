<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Ring Hologram Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00A3FF" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#7000FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Telescope Dome Metal Gradient -->
    <linearGradient id="domeGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Neon Border -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="1.8" />

  <!-- Outer Celestial Telemetry Orbit (Dashed) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2.5 3.5" opacity="0.45" />

  <!-- 4 Strategic Agent Constellation Nodes (Claude, Codex, AGY, OpenCode) -->
  <circle cx="32" cy="9" r="2.2" fill="#00F2FE" filter="url(#glow)" />
  <circle cx="55" cy="32" r="2.2" fill="#818CF8" filter="url(#glow)" />
  <circle cx="32" cy="55" r="2.2" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="9" cy="32" r="2.2" fill="#C084FC" filter="url(#glow)" />

  <!-- Telemetry Coordinate Crosshairs -->
  <line x1="32" y1="5" x2="32" y2="13" stroke="#00F2FE" stroke-width="1.2" opacity="0.7"/>
  <line x1="32" y1="51" x2="32" y2="59" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>
  <line x1="5" y1="32" x2="13" y2="32" stroke="#C084FC" stroke-width="1.2" opacity="0.7"/>
  <line x1="51" y1="32" x2="59" y2="32" stroke="#818CF8" stroke-width="1.2" opacity="0.7"/>

  <!-- Radar Sweep Cone -->
  <path d="M32 32 L47 17 A21 21 0 0 0 32 11 Z" fill="url(#coreGlow)" opacity="0.35" />

  <!-- Observatory Inner Orbit Rings -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="url(#ringGrad)" stroke-width="1.6" opacity="0.85" />
  <circle cx="32" cy="32" r="11" fill="#020617" stroke="#1E293B" stroke-width="1.2" />

  <!-- Glowing Core Radial Aura -->
  <circle cx="32" cy="32" r="9" fill="url(#coreGlow)" />

  <!-- Stylized Observatory Telescope Lens / Aperture Slit -->
  <!-- Diagonal Slit with Cyan Starlight -->
  <path d="M22 38 L38 22 L42 26 L26 42 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
  
  <!-- Optical Telescope Lens Barrel -->
  <line x1="24" y1="40" x2="40" y2="24" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Central Pulse / Observation Star Beacon -->
  <circle cx="35" cy="29" r="2.8" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="35" cy="29" r="1.4" fill="#00F2FE"/>

  <!-- Outer Satellite Telemetry Pulse -->
  <circle cx="44" cy="20" r="1.2" fill="#F43F5E" filter="url(#glow)"/>
</svg>
