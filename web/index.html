<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="obs-token" content="__OBS_TOKEN__">
<title>Agent Observatory</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="layout" id="layout">
  <aside class="side" id="side" data-i18n-attr="aria-label:nav.history">
    <div class="side-head">
      <button class="newbtn" id="newChat" type="button"><span class="ico" id="newIco"></span><span data-i18n="nav.newChat">Yeni sohbet</span></button>
    </div>
    <nav class="history" id="history"></nav>
    <div class="side-foot" id="engineStatus" data-i18n-attr="aria-label:status.engines"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <header class="top">
      <button class="iconbtn" id="sideToggle" type="button" data-i18n-attr="aria-label:nav.toggle"><span class="ico" id="sideIco"></span></button>
      <div class="brand">Agent Observatory</div>
      <button class="crumb" id="crumb" type="button" hidden></button>
      <div class="spacer"></div>
      <canvas class="cup" id="cup" width="14" height="10" hidden></canvas>
      <button class="iconbtn" id="phoneBtn" type="button"><span class="ico" id="phoneIco"></span></button>
      <button class="iconbtn" id="capsBtn" type="button"><span class="ico" id="capsIco"></span></button>
      <button class="ghost" id="langBtn" type="button"></button>
      <button class="iconbtn" id="themeBtn" type="button"><span class="ico" id="themeIco"></span></button>
    </header>
    <main id="main">
      <section class="empty" id="empty">
        <h1 data-i18n="empty.title">Ne yaptırmak istersin?</h1>
      </section>
      <section class="thread" id="thread" aria-live="polite"></section>
    </main>
    <button class="jump" id="jump" type="button" hidden data-i18n="jump">En alta in</button>
    <footer class="dock">
      <div class="composer" id="composer">
        <textarea id="prompt" rows="1" data-i18n-attr="placeholder:composer.placeholder;aria-label:composer.label"></textarea>
        <div class="bar">
          <div class="left">
            <button class="pill" id="projectBtn" type="button" aria-haspopup="listbox"><span class="ico" id="projectIco"></span><span id="projectLabel"></span><span class="ico chev"></span></button>
            <button class="pill" id="modeBtn" type="button"><span class="ico" id="modeIco"></span><span id="modeLabel"></span></button>
          </div>
          <div class="right">
            <div class="think" id="think" role="radiogroup" hidden></div>
            <button class="pill model" id="modelBtn" type="button" aria-haspopup="listbox"><span class="dot" id="modelDot"></span><span id="modelLabel"></span><span class="ico chev"></span></button>
            <button class="send" id="send" type="button"></button>
          </div>
        </div>
        <div class="menu" id="modelMenu" hidden></div>
        <div class="menu small" id="projectMenu" hidden></div>
        <div class="menu small slash" id="slashMenu" hidden></div>
      </div>
      <div class="foot" id="foot"></div>
    </footer>
  </div>
</div>
<script src="/i18n.js"></script>
<script src="/lang-tr.js"></script>
<script src="/lang-en.js"></script>
<script src="/md.js"></script>
<script src="/cup.js"></script>
<script src="/context.js"></script>
<script src="/projects.js"></script>
<script src="/store.js"></script>
<script src="/app.js"></script>
</body>
</html>
