<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="obs-token" content="__OBS_TOKEN__">
<title>Agent Observatory</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="brand">Agent Observatory</div>
  <div class="engines" id="engineStatus" aria-label="Motor durumları"></div>
  <button class="ghost" id="newChat" type="button">Yeni sohbet</button>
</header>
<main id="main">
  <section class="empty" id="empty">
    <h1>Ne yaptırmak istersin?</h1>
    <p class="sub">İstemi bir motora ver: Claude Code, Codex, OpenCode ya da Antigravity.</p>
  </section>
  <section class="thread" id="thread" aria-live="polite"></section>
</main>
<footer class="dock">
  <div class="composer" id="composer">
    <textarea id="prompt" rows="1" placeholder="Bir şey yaz ve Enter'a bas. Satır atlamak için Shift+Enter"></textarea>
    <div class="bar">
      <div class="left">
        <button class="pill" id="projectBtn" type="button" aria-haspopup="listbox"><span class="ico" id="projectIco"></span><span id="projectLabel">Klasör</span><span class="ico chev"></span></button>
        <button class="pill" id="modeBtn" type="button" title="Salt okunur: dosya değiştirilmez"><span class="ico" id="modeIco"></span><span id="modeLabel">Salt okunur</span></button>
      </div>
      <div class="right">
        <button class="pill model" id="modelBtn" type="button" aria-haspopup="listbox"><span class="dot" id="modelDot"></span><span id="modelLabel">Model</span><span class="ico chev"></span></button>
        <button class="send" id="send" type="button" aria-label="Gönder"></button>
      </div>
    </div>
    <div class="menu" id="modelMenu" hidden></div>
    <div class="menu small" id="projectMenu" hidden></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="foot" id="foot"></div>
</footer>
<script src="/app.js"></script>
</body>
</html>
